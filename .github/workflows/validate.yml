name: Validate plugin
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
    env:
      CARGO_TARGET_DIR: /tmp/spotify-target
      OMARCHY_PATH: /usr/share/omarchy
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install snapshot dependencies
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/09/07/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          sed -i 's/^ParallelDownloads.*/ParallelDownloads = 2/' /etc/pacman.conf
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "Attempt $attempt failed; retrying in 5s..." >&2
              sleep 5
            done
            return 1
          }
          retry pacman -Syyuu --noconfirm --disable-download-timeout
          retry pacman -S --needed --noconfirm --disable-download-timeout git jq ripgrep python qt6-declarative quickshell libpulse openssl pkgconf rustup dbus xdg-utils avahi libgcrypt libsecret
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          echo '/usr/lib/qt6/bin' >> "$GITHUB_PATH"
      - name: Validate the exact checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/spotify-runtime
          chmod 700 /tmp/spotify-runtime
          export XDG_RUNTIME_DIR=/tmp/spotify-runtime
          bash scripts/test.sh
